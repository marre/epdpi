[package]
name = "epdpi-esp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Raw-parallel e-paper transports for classic ESP32 I2S DMA and ESP32-S3 LCD_CAM DMA"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/epdpi-esp"
readme = "README.md"
homepage.workspace = true
keywords = ["epd", "epaper", "esp32", "esp-hal", "embedded-hal"]
categories = ["embedded", "no-std", "hardware-support"]
# esp-hal 1.1 needs Rust 1.88.
rust-version = "1.88"
exclude = ["**/.DS_Store"]

[dependencies]
# Default features off, so this crate never switches the core to blocking by itself. The
# `blocking` feature below forwards the choice.
epdpi = { version = "0.3.0", path = "../epdpi", default-features = false }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
maybe-async-cfg = "0.2"
esp-hal = { version = "~1.1.0", optional = true, features = ["unstable"] }
defmt = { version = "1.0", optional = true }

[dev-dependencies]
pollster = "1"

[features]
default = ["blocking"]
# Blocking `embedded-hal` API, forwarded to `epdpi`. Turn off with `default-features = false`
# for the async API.
blocking = ["epdpi/blocking"]
defmt = ["dep:defmt", "epdpi/defmt"]
# Classic ESP32 I2S1 8-bit parallel DMA transmitter.
esp32 = ["dep:esp-hal", "esp-hal/esp32"]
# ESP32-S3 LCD_CAM DMA buses.
esp32s3 = ["dep:esp-hal", "esp-hal/esp32s3"]

# docs.rs builds the default features on its Linux host. Chip features need Xtensa targets, so
# `lcd_bus` and `shift_reg_bus` are prose-only pages there (see `docs/`). Never `all-features` here.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
