[package]
name = "inkplate5v2-diagnostic"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Read-only first-stage Inkplate 5 Gen 2 ESP32 diagnostic image"

# An independent workspace deliberately does not link to epdpi-esp or
# any display power/control crate. A diagnostic build cannot request HV
# enable, waveform scans or I2S DMA.
[workspace]

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32", "uart"] }
esp-backtrace = { version = "=0.19.0", default-features = false, features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32"] }

[profile.release]
opt-level = "s"
debug = true
lto = "fat"
codegen-units = 1
